name: Release TinyToolSubmitter

on:
  push:
    tags:
      - "submitter-v*"

  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet package version (semver, e.g. 1.0.1)'
        required: true
        type: string

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/submitter-v}
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore src/TinyToolSubmitter.csproj

      - name: Build
        run: dotnet build src/TinyToolSubmitter.csproj --configuration Release --no-restore

      - name: Create NuGet package
        run: |
          dotnet pack src/TinyToolSubmitter.csproj \
            --configuration Release \
            --output ./artifacts \
            --no-build \
            -p:NoDefaultExcludes=true \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Log in to NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: jamesmontemagno

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ steps.version.outputs.VERSION }}
          path: ./artifacts/*.nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: submitter-v${{ steps.version.outputs.VERSION }}
          files: ./artifacts/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
